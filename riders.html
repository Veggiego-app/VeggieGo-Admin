<script type="module">
import { auth } from "./firebase.js"
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"

onAuthStateChanged(
auth,
async (user) => {

    if (!user) {

        window.location.href =
        "login.html"

        return

    }

    const adminEmails = [
    "support@veggiego.co.in"
]

    if (

        !adminEmails.includes(
            user.email
        )

    ) {

        await auth.signOut()

        alert(
            "Access Denied"
        )

        window.location.href =
        "login.html"

        return

    }

})
</script>
