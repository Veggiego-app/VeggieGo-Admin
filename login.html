<!DOCTYPE html>
<html>

<head>

<title>
VeggieGo Admin Login
</title>

<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="login.css" />

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="login-logo">
            🍃
        </div>

        <h2>
            🍃 VeggieGo Admin
        </h2>

        <p>
            Manage Restaurants, Riders & Orders
        </p>

        <input
        id="email"
        type="email"
        placeholder="Email"
        class="login-input"
        />

        <input
        id="password"
        type="password"
        placeholder="Password"
        class="login-input"
        />

        <button
        id="loginBtn"
        class="login-btn"
        >

            🔐 Login to Admin Panel

        </button>

    </div>

</div>

<script
type="module"
src="login.js"
></script>

</body>

</html>
