<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Details</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="riders.css">
</head>

<body>
    <aside class="sidebar rider-sidebar">
        <div class="sidebar-logo">🥗 VeggieGo</div>
        <nav class="menu">
            <a href="index.html" class="menu-item">📊 Dashboard</a>
            <a href="orders.html" class="menu-item">📦 Orders</a>
            <a href="restaurants.html" class="menu-item">🍽 Restaurants</a>

        <div class="admin-profile">
            <div class="admin-name">VeggieGo Admin</div>

    <div id="riderLoading" class="rider-loading" aria-hidden="true"><div class="rider-spinner"></div><strong id="riderLoadingText">Updating...</strong></div>
