<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>
        VeggieGo Orders
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    />
<link
rel="stylesheet"
href="orders.css"
/>
</head>

<body>
    <script type="module">

import {
auth
}
from "./firebase.js"

import {
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"

onAuthStateChanged(
auth,
async (user) => {

    if (!user) {

        window.location.href =
        "login.html"

        return

    }

    const adminEmails = [
    "support@veggiego.co.in"
]

    if (

        !adminEmails.includes(
            user.email
        )

    ) {

        await auth.signOut()

        alert(
            "Access Denied"
        )

        window.location.href =
        "login.html"

        return

    }

})

</script>

    <!-- SIDEBAR -->

            <select id="paymentFilter">

        <!-- TABLE -->

</th>

</th>

</tr>

                </tbody>

        </div>

    </div>

    <script type="module" src="orders.js"></script>

</body>
