<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Details</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="restaurant.css">
</head>

<body>
    <aside class="sidebar restaurant-sidebar">
        <div class="sidebar-logo">🍃 VeggieGo</div>

        <nav class="menu">
            <button type="button" class="menu-item" data-href="index.html">📊 Dashboard</button>
            <button type="button" class="menu-item active" data-href="restaurants.html">🍽 Restaurants</button>
            <button type="button" class="menu-item" data-href="riders.html">🛵 Riders</button>
            <button type="button" class="menu-item" data-href="customers.html">👤 Customers</button>
            <button type="button" class="menu-item" data-href="analytics.html">📊 Analytics</button>
            <button type="button" class="menu-item" data-href="cod-settlement.html">💵 COD Settlement</button>
            <button type="button" class="menu-item" data-href="settings.html">⚙ Settings</button>
        </nav>

        <div class="admin-profile">
            <div class="admin-name">VeggieGo Admin</div>
            <div class="admin-role">● Super Admin</div>
            <button type="button" class="logout-btn" id="logoutBtn">⎋ Logout</button>
        </div>
    </aside>

    <main class="main restaurant-detail-page">
        <div id="restaurantDetails" class="restaurant-details-root">
            <div class="page-loading-card">Loading restaurant details...</div>
        </div>
    </main>

    <div id="toast" class="restaurant-toast" role="status" aria-live="polite"></div>

    <div id="loadingOverlay" class="restaurant-loading-overlay" aria-hidden="true">
        <div class="restaurant-spinner"></div>
        <strong id="loadingText">Saving...</strong>
    </div>

    <div id="dialogOverlay" class="restaurant-dialog-overlay" aria-hidden="true">
        <div id="dialogContent" class="restaurant-dialog"></div>
    </div>

    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCGxua4ApZbRdYP1wA6e8b4AwvqdKxrZVc&libraries=places"
        async
        defer>
    </script>
    <script type="module" src="restaurant-details.js"></script>
</body>

</html>
